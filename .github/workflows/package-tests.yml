name: Astro tests and ordinary package

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    defaults:
      run:
        working-directory: packages/astro-discussion-bridge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - name: Install the ordinary locked development dependencies
        run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Check the exact shared runtime and build normal browser assets
        run: |
          node scripts/refresh-contract.mjs --check
          npm run build:browser
          git diff --exit-code -- src/assets
      - name: Run all existing tests against an actual ordinary saved archive
        run: npm test
      - name: Verify normal production installation and native Astro build without fixture aliases
        run: npm run test:normal-consumer
      - name: Require reproducible committed TypeScript output
        run: git diff --exit-code -- dist
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: astro-discussion-bridge-node-${{ matrix.node }}-${{ github.sha }}
          path: |
            .artifacts/astro-v4-*/*.tgz
            .artifacts/astro-v4-*/*.json
            .artifacts/astro-v4-*/*.html
            .artifacts/astro-v4-*/*.bin
          include-hidden-files: true
          if-no-files-found: error
